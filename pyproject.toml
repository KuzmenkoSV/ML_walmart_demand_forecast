[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "walmart_project_kuzmenko"
version = "0.0.1"
description = "This project is dedicated to the task of forecasting demand"
authors = [
  { name = "KuzmenkoSV" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.ruff.lint.isort]
known_first_party = ["walmart_project_kuzmenko"]
force_sort_within_sections = true
